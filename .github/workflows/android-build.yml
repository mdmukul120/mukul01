name: Android APK & Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_URL: ${{ vars.APP_URL }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install & build web app
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --assetPath assets \
            --iconBackgroundColor '#2ee83f' --iconBackgroundColorDark '#2ee83f' \
            --splashBackgroundColor '#040a06' --splashBackgroundColorDark '#040a06'
          # version
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/; s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          npx cap sync android

      - name: Build APK
        id: build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          OUT="MukulPlus-v${VERSION_NAME}.apk"
          cd android
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            ./gradlew assembleRelease --no-daemon
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" --key-pass "pass:${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
              --out "../$OUT" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify "../$OUT"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - building a debug-signed APK."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "../$OUT"
          fi
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: MukulPlus-apk
          path: ${{ steps.build.outputs.apk }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Mukul Plus v${{ env.VERSION_NAME }}
          generate_release_notes: true
          files: ${{ steps.build.outputs.apk }}
